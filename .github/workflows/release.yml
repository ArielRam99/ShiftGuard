name: ShiftGuard Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use semantic versioning, for example v1.0.0"
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to reviewed commits already on main"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test tagged source
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test browser authentication scripts
        run: node --test tests-js/*.test.js

      - name: Build Windows distribution
        run: python -m PyInstaller --clean --noconfirm shiftguard.spec

      - name: Smoke test authenticated Windows workflow
        run: python tests/smoke_packaged.py dist/ShiftGuard/ShiftGuard.exe

      - name: Package release files
        id: package
        shell: pwsh
        run: |
          $archive = "ShiftGuard-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path ".\dist\ShiftGuard" -DestinationPath ".\dist\$archive"
          $hash = (Get-FileHash ".\dist\$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content ".\dist\$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "${{ steps.package.outputs.archive }}"
          gh release create "${{ github.ref_name }}" `
            ".\dist\$archive" `
            ".\dist\$archive.sha256" `
            --verify-tag `
            --title "ShiftGuard ${{ github.ref_name }}" `
            --generate-notes
