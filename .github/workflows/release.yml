name: ShiftGuard Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use semantic versioning, for example v1.0.0"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test tagged source
        run: python -m pytest -v

      - name: Build Windows distribution
        run: python -m PyInstaller --clean --noconfirm shiftguard.spec

      - name: Require signing credentials
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Release signing secrets are not configured"
          }

      - name: Sign Windows executable
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "shiftguard-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "signtool.exe was not found"
            }
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD `
              ".\dist\ShiftGuard\ShiftGuard.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed"
            }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows executable signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature ".\dist\ShiftGuard\ShiftGuard.exe"
          if ($signature.Status -ne "Valid") {
            throw "Invalid executable signature: $($signature.StatusMessage)"
          }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"

      - name: Smoke test Windows executable
        shell: pwsh
        env:
          SHIFTGUARD_NO_BROWSER: "1"
          SHIFTGUARD_PORT: "5055"
        run: |
          $process = Start-Process -FilePath ".\dist\ShiftGuard\ShiftGuard.exe" -PassThru
          try {
            $healthy = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-RestMethod "http://127.0.0.1:5055/api/health"
                if ($response.status -eq "ok") {
                  $healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "ShiftGuard executable did not pass its health check"
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package release files
        id: package
        shell: pwsh
        run: |
          $archive = "ShiftGuard-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path ".\dist\ShiftGuard" -DestinationPath ".\dist\$archive"
          $hash = (Get-FileHash ".\dist\$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content ".\dist\$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "${{ steps.package.outputs.archive }}"
          gh release create "${{ github.ref_name }}" `
            ".\dist\$archive" `
            ".\dist\$archive.sha256" `
            --verify-tag `
            --title "ShiftGuard ${{ github.ref_name }}" `
            --generate-notes