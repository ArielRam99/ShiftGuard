name: ShiftGuard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Enforce focused PR production-line budget
        if: github.event_name == 'pull_request'
        run: python tests/check_pr_size.py ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Verify application initialization
        run: python -c "import app; print('App imported and database initialized successfully!')"

      - name: Run tests
        run: python -m pytest -v

      - name: Run browser tests
        run: node --test tests-js/*.test.js

      - name: Exercise authenticated source workflow
        run: python tests/smoke_packaged.py python run_shiftguard.py

  build-windows:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm shiftguard.spec

      - name: Smoke test authenticated Windows workflow
        run: python tests/smoke_packaged.py dist/ShiftGuard/ShiftGuard.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ShiftGuard-Windows
          path: dist/ShiftGuard/
          if-no-files-found: error
          retention-days: 30
