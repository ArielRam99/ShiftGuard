name: ShiftGuard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application initialization
        run: python -c "import app; print('App imported and database initialized successfully!')"

      - name: Run tests
        run: python -m pytest -v

  build-windows:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm shiftguard.spec

      - name: Sign Windows executable
        id: sign
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            Write-Warning "Windows signing certificate is not configured; artifact will be unsigned"
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "shiftguard-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "signtool.exe was not found"
            }
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD `
              ".\dist\ShiftGuard\ShiftGuard.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed"
            }
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows executable signature
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature ".\dist\ShiftGuard\ShiftGuard.exe"
          if ($signature.Status -ne "Valid") {
            throw "Invalid executable signature: $($signature.StatusMessage)"
          }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"

      - name: Smoke test Windows executable
        shell: pwsh
        env:
          SHIFTGUARD_NO_BROWSER: "1"
          SHIFTGUARD_PORT: "5055"
        run: |
          $process = Start-Process -FilePath ".\dist\ShiftGuard\ShiftGuard.exe" -PassThru
          try {
            $healthy = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-RestMethod "http://127.0.0.1:5055/api/health"
                if ($response.status -eq "ok") {
                  $healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "ShiftGuard executable did not pass its health check"
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ShiftGuard-Windows
          path: dist/ShiftGuard/
          if-no-files-found: error
          retention-days: 30

