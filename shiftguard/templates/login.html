<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | ShiftGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen place-items-center bg-[#f5f6f2] px-5 font-['DM_Sans'] text-[#17201c]">
  <main class="w-full max-w-sm">
    <div class="mb-8 flex items-center gap-3">
      <span class="grid size-11 place-items-center rounded-md bg-[#174d3a] text-xl font-bold text-white">S</span>
      <div><h1 class="font-['Newsreader'] text-3xl font-semibold leading-none">ShiftGuard</h1><p class="mt-1 text-xs text-black/55">Scheduling console</p></div>
    </div>
    <form method="post" class="rounded-lg border border-black/10 bg-white p-6 shadow-[0_18px_50px_rgba(23,32,28,0.08)]">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <h2 class="font-['Newsreader'] text-2xl font-semibold">Sign in</h2>
      <p class="mt-1 text-sm text-black/55">Use your ShiftGuard account.</p>
      {% for message in get_flashed_messages() %}<p class="mt-4 rounded-md bg-[#d9694b]/10 px-3 py-2 text-sm text-[#a23d27]" role="alert">{{ message }}</p>{% endfor %}
      <label class="mt-5 block text-xs font-bold uppercase text-black/60">Email<input name="email" type="email" autocomplete="username" required autofocus class="mt-2 w-full rounded-md border border-black/15 px-3 py-2.5 outline-none focus:border-[#2f7658] focus:ring-2 focus:ring-[#2f7658]/15"></label>
      <label class="mt-4 block text-xs font-bold uppercase text-black/60">Password<input name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-md border border-black/15 px-3 py-2.5 outline-none focus:border-[#2f7658] focus:ring-2 focus:ring-[#2f7658]/15"></label>
      <button class="mt-6 w-full rounded-md bg-[#174d3a] px-4 py-3 text-sm font-bold text-white hover:bg-[#2f7658]">Sign in</button>
    </form>
  </main>
</body>
</html>
