<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create administrator | ShiftGuard</title>
  <style>
    body { margin: 0; background: #f5f6f2; color: #17201c; font: 1rem system-ui; }
    main { max-width: 26rem; margin: 8vh auto; padding: 2rem; background: white; border-radius: .75rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: .8rem; margin-top: .5rem; font: inherit; }
    button { background: #174d3a; color: white; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Create administrator</h1>
    <p>This private setup closes after the first account is created.</p>
    {% for message in get_flashed_messages() %}<p role="alert">{{ message }}</p>{% endfor %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="setup_token" value="{{ setup_token }}">
      <label>Name<input name="display_name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
      <label>Confirm password<input name="password_confirmation" type="password" minlength="12" autocomplete="new-password" required></label>
      <button>Create account</button>
    </form>
  </main>
  <script>history.replaceState({}, '', '/setup');</script>
</body>
</html>
